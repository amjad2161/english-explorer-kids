# Run with Admin API access (shopify app execute or custom app token):
#   shopify app execute --store mobarsham.myshopify.com --query @scripts/bootstrap-policies.graphql
#
# Creates missing legal policies for OneClick Hub (English; edit in Admin after).

mutation BootstrapRefundPolicy {
  shopPolicyUpdate(
    shopPolicy: {
      type: REFUND
      body: "<h2>Refund policy</h2><p>OneClick Hub offers refunds on eligible items within 14 days of delivery. Contact us at mobarsham@gmail.com with your order number. Items must be unused and in original packaging unless defective.</p>"
    }
  ) {
    shopPolicy { id type }
    userErrors { field message }
  }
}

mutation BootstrapShippingPolicy {
  shopPolicyUpdate(
    shopPolicy: {
      type: SHIPPING
      body: "<h2>Shipping policy</h2><p>We ship across Israel. Processing takes 1-3 business days. Delivery times vary by carrier and location. You will receive tracking when your order ships.</p>"
    }
  ) {
    shopPolicy { id type }
    userErrors { field message }
  }
}

mutation BootstrapTermsPolicy {
  shopPolicyUpdate(
    shopPolicy: {
      type: TERMS_OF_SERVICE
      body: "<h2>Terms of service</h2><p>By using OneClick Hub you agree to these terms. Products are sold as described. Prices are in ILS unless stated otherwise. We may update these terms; continued use means acceptance.</p>"
    }
  ) {
    shopPolicy { id type }
    userErrors { field message }
  }
}
