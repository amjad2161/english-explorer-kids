name: SmartClick fix pack

on:
  push:
    paths:
      - "shopify-smartclick/**"
      - ".github/workflows/shopify-smartclick.yml"
  pull_request:
    paths:
      - "shopify-smartclick/**"
      - ".github/workflows/shopify-smartclick.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-smartclick

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: shopify-smartclick/package-lock.json

      - run: npm ci
      - run: npm test
